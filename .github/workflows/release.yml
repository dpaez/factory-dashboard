name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the kit version
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          default="$(grep -A1 '^  version:' kit/factory-dashboard/factory-dashboard.yaml | awk -F'"' '/default:/ { print $2 }')"
          if [ -z "$default" ]; then
            echo "Could not read the version default from the kit descriptor." >&2
            exit 1
          fi
          if [ "$tag" != "$default" ]; then
            echo "Tag v${tag} does not match the kit version default ${default}." >&2
            exit 1
          fi
          echo "version=${tag}" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:check
      - run: node scripts/pack-release.mjs "${{ steps.version.outputs.version }}"
      - run: node scripts/smoke-release.mjs "${{ steps.version.outputs.version }}"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          args=(
            release create "$GITHUB_REF_NAME"
            "release/factory-dashboard-${version}.tgz"
            "release/factory-dashboard-${version}.tgz.sha256"
            --title "$GITHUB_REF_NAME"
            --notes "factory-dashboard ${version}"
          )
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push the mixin
        run: |
          docker buildx build kit/factory-dashboard \
            -f kit/factory-dashboard/factory-dashboard.yaml \
            --platform linux/amd64,linux/arm64 \
            -t "ghcr.io/dpaez/sbx-kit-factory-dashboard:${{ steps.version.outputs.version }}" \
            --push
